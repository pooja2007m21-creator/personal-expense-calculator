<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Expense Calculator</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <h1>💰 Personal Expense Calculator</h1>
    <p>Track your income and expenses, and see how much you save.</p>
  </header>

  <main class="container">
    <section class="cards" aria-label="Dashboard">
      <div class="card stat income"><h2>Total Income</h2><p id="totalIncome">₹0</p></div>
      <div class="card stat expense"><h2>Total Expenses</h2><p id="totalExpenses">₹0</p></div>
      <div class="card stat savings"><h2>Total Savings</h2><p id="totalSavings">₹0</p></div>
    </section>

    <section class="inputs">
      <form id="incomeForm" class="card" novalidate>
        <h2>Monthly Income</h2>
        <label for="incomeAmount">Income amount (₹)</label>
        <input type="number" id="incomeAmount" placeholder="e.g. 25000" step="any">
        <p class="msg" id="incomeMsg" role="alert"></p>
        <button type="submit">Add / Update Income</button>
      </form>

      <form id="expenseForm" class="card" novalidate>
        <h2>Add Expense</h2>
        <label for="expenseName">Expense name</label>
        <input type="text" id="expenseName" placeholder="e.g. Groceries">
        <label for="expenseAmount">Expense amount (₹)</label>
        <input type="number" id="expenseAmount" placeholder="e.g. 1500" step="any">
        <label for="expenseCategory">Category</label>
        <select id="expenseCategory">
          <option value="">Select category</option>
          <option>Food</option><option>Transport</option><option>Education</option>
          <option>Shopping</option><option>Bills</option><option>Entertainment</option><option>Other</option>
        </select>
        <p class="msg" id="expenseMsg" role="alert"></p>
        <button type="submit">Add Expense</button>
      </form>
    </section>

    <section class="card">
      <h2>Expense List</h2>
      <ul id="expenseList" class="expense-list"></ul>
    </section>

    <section class="grid-2">
      <div class="card"><h2>Category Breakdown</h2><ul id="categoryList" class="breakdown"></ul></div>
      <div class="card"><h2>Summary Report</h2><div id="summary"></div></div>
    </section>

    <button id="resetBtn" class="danger">Reset All</button>
  </main>

  <footer class="footer">Personal Expense Calculator · © 2026 All rights reserved</footer>
  <script src="js/script.js"></script>
</body>
</html>
